<h2>Exercício 10 - Login</h2>

<label>
  Usuário:
  <input type="text" [(ngModel)]="usuario">
</label>

<br><br>

<label>
  Senha:
  <input type="password" [(ngModel)]="senha">
</label>

<br><br>

<button (click)="entrar()" [disabled]="usuario === '' || senha === ''">
  Entrar
</button>

<p>{{ mensagem }}</p>
